name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProtoCache.NET.sln

      - name: Build
        run: dotnet build ProtoCache.NET.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ProtoCache.Tests/ProtoCache.Tests.csproj --configuration Release --no-build --no-restore

      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatbuffers-compiler

      - name: Generate benchmark fixture
        run: ./ProtoCache.Benchmark/generate-fixtures.sh

      - name: Build benchmark fixture into output
        run: dotnet build ProtoCache.Benchmark/ProtoCache.Benchmark.csproj --configuration Release --no-restore

      - name: Smoke-test benchmark
        working-directory: /tmp
        run: >-
          dotnet run
          --project "$GITHUB_WORKSPACE/ProtoCache.Benchmark/ProtoCache.Benchmark.csproj"
          --configuration Release
          --no-build
          --no-restore
